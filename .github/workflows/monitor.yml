name: FC 27 price monitor

on:
  schedule:
    - cron: "17 */3 * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Envoyer uniquement une notification Discord de test"
        required: true
        default: false
        type: boolean

      rediscover_game_ids:
        description: "Redécouvrir les IDs Standard / Ultimate sur IsThereAnyDeal"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fc27-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Test Discord
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: python src/monitor.py --test-discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Monitor prices
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        run: |
          EXTRA=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rediscover_game_ids }}" = "true" ]; then
            EXTRA="--rediscover"
          fi

          python src/monitor.py $EXTRA
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Persist monitor state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "Aucun changement d'état à enregistrer."
            exit 0
          fi

          git config user.name "fc27-price-bot"
          git config user.email "fc27-price-bot@users.noreply.github.com"

          git add data/state.json
          git commit -m "chore: update FC27 price state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
